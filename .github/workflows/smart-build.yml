name: Smart Boost Build

on:
  workflow_dispatch:
  push:
    branches: [ "smart-download" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PKG: tw.nekomimi.nekogram.smart
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure build
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          # Fall back to the public api_id published in Telegram's official Android source (DrKLO/Telegram BuildVars)
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "No API_ID/API_HASH secrets, using Telegram's public open-source api_id"
            API_ID=4
            API_HASH=014b35b6184100b085b0d0572f9b5103
          fi
          echo "apiId=$API_ID"   >> local.properties
          echo "apiHash=$API_HASH" >> local.properties
          echo "sentryDsn=" >> local.properties
          echo "helperBotId=0" >> local.properties
          echo "helperBotUsername=" >> local.properties
          echo "mapsApiKey=none" >> local.properties
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx12g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          # Separate package so it installs next to official Nekogram for A/B speed tests
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=$PKG/" gradle.properties
          # arm64 only, keeps the native build within free-runner limits
          sed -i 's/include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/include "arm64-v8a"/' TMessagesProj_App/build.gradle
          # arm64 only, without injected ABI (that marks the APK testOnly)
          sed -i 's/include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/include "arm64-v8a"/; s/universalApk true/universalApk false/' TMessagesProj_App/build.gradle
          for f in TMessagesProj/build.gradle; do
            sed -i '0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' $f
          done
          grep -n -A2 "defaultConfig {" TMessagesProj/build.gradle TMessagesProj_App/build.gradle
          # No Sentry upload without credentials
          sed -i 's/uploadNativeSymbols = true/uploadNativeSymbols = false/; s/includeSourceContext = true/includeSourceContext = false\n    autoUploadProguardMapping = false/' TMessagesProj_App/build.gradle
          # Placeholder Firebase config (push via FCM won't work in this build)
          cat > TMessagesProj_App/google-services.json <<JSON
          {"project_info":{"project_number":"000000000000","project_id":"nekogram-smart","storage_bucket":"nekogram-smart.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"$PKG"}},
           "oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyDummyDummyDummyDummyDummyDum"}],
           "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON

      - name: Release signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          # Fixed release key (encrypted in the repo). No key, no release: never ship a debug-signed APK.
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::SIGNING_PASSPHRASE secret is missing"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in .github/signing/release.p12.enc \
            -out "$RUNNER_TEMP/release.p12" -pass env:SIGNING_PASSPHRASE
          echo "storeFile=$RUNNER_TEMP/release.p12" >> local.properties
          echo "storePassword=$SIGNING_PASSPHRASE" >> local.properties
          echo "keyAlias=smartboost" >> local.properties
          echo "keyPassword=$SIGNING_PASSPHRASE" >> local.properties

      - name: Build
        run: ./gradlew :TMessagesProj_App:assembleRelease --no-daemon -x uploadSentryProguardMappingsRelease

      - name: Verify signing certificate
        run: |
          for apk in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            python3 .github/signing/verify_cert.py "$apk" TMessagesProj/jni/colorado/colorado.h
          done
          rm -f "$RUNNER_TEMP/release.p12"

      - name: List outputs
        if: always()
        run: find . -name '*.apk' -not -path './.git/*' | head -50

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Nekogram-smart-arm64
          path: TMessagesProj_App/build/outputs/apk/release/*.apk

      - name: Compose release notes
        run: |
          {
            echo "## 本版更新 / What's new"
            echo
            cat .github/release-notes/next.md
            echo
            cat .github/release-notes/footer.md
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: smart-${{ github.run_number }}
          name: Nekogram Smart Boost ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: TMessagesProj_App/build/outputs/apk/release/*.apk
          body_path: ${{ runner.temp }}/release-notes.md
